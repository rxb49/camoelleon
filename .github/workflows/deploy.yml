name: Build and Deploy .exe

on:
  push:
    branches:
      - main # Déclenche le workflow pour chaque push vers la branche 'main'

jobs:
  build:
    runs-on: windows-latest # CHANGÉ de ubuntu-latest à windows-latest

    steps:
      # Étape 1 : Check-out du code source depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Étape 2 : Installer les outils nécessaires pour construire l'application (ex : .NET SDK)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "8.0.300" # Choisis la version de .NET qui correspond à ton projet

      # Étape 3 : Restaurer les dépendances du projet
      - name: Restore dependencies
        run: ls # Spécifie le chemin du fichier .sln

      # Étape 3 : Restaurer les dépendances du projet
      - name: Restore dependencies
        run: ls camouelleon # Spécifie le chemin du fichier .sln

      # Étape 3 : Restaurer les dépendances du projet
      - name: Restore dependencies
        run: dotnet restore camouelleon/camouelleon.sln # Spécifie le chemin du fichier .sln

      # Étape 4 : Construire l'application et générer le fichier .exe
      - name: Build and publish application
        run: dotnet publish camouelleon/camouelleon.sln -c Release -r win-x64 --self-contained -o ./publish

      - name: Create ZIP archive
        run: powershell Compress-Archive -Path ./publish/* -DestinationPath camouelleon.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "camouelleon.zip"
          target: "/var/www/telechargement/"

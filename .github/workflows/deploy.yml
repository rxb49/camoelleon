name: Build and Deploy .exe

on:
  push:
    branches:
      - main  # Déclenche le workflow pour chaque push vers la branche 'main'

jobs:
  build:
    runs-on: windows-latest  # Utilise un environnement Windows pour construire le .exe

    steps:
      # Étape 1 : Check-out du code source depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Étape 2 : Installer les outils nécessaires pour construire l'application (ex : .NET SDK)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.300'  # Choisis la version de .NET qui correspond à ton projet

      # Étape 3 : Restaurer les dépendances du projet
      - name: Restore dependencies
        run: cd camoelleon/camoelleon 

      # Étape 3 : Restaurer les dépendances du projet
      - name: Restore dependencies
        run: dotnet restore

      # Étape 4 : Construire l'application et générer le fichier .exe
      - name: Build .exe
        run: dotnet publish -c Release -r win-x64 --self-contained -o ./publish

      # Étape 5 : Déployer le fichier .exe sur ton serveur via scp
      - name: Deploy .exe to server
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "./publish/YourApp.exe"
          target: "/var/www/telechargement/camoelleon.exe"
